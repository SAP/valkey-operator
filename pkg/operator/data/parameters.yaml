{{- $fullname := (printf "valkey-%s" .Name) }}

fullnameOverride: {{ $fullname }}

{{- $authEnabled := (dig "auth" "enabled" false .) }}
{{- $tlsEnabled := (dig "tls" "enabled" false .) }}
{{- $persistenceEnabled := (dig "persistence" "enabled" false .) }}
{{- $replicasCount := (dig "replicas" 1 .) }}

{{- $authSecretName := printf "%s" $fullname }}
{{- $valkeyPassword := (sha256sum (printf "%s:%s:valkey-password" .Namespace $fullname) | trunc 32) }}
{{- $tlsSecretName := printf "%s-crt" $fullname }}
{{- if and $tlsEnabled (hasKey .tls "certManager") }}
{{- $tlsSecretName = printf "%s-tls" $fullname }}
{{- end }}

image:
  repository: valkey/valkey
  {{- with .Version }}
  tag: {{ . }}
  {{- end }}

# Authentication configuration
auth:
  enabled: {{ $authEnabled }}
  {{- if $authEnabled }}
  usersExistingSecret: {{ $authSecretName }}
  aclConfig: |
    user default on >{{ $valkeyPassword }} ~* &* +@all
  {{- end }}

# TLS configuration
tls:
  enabled: {{ $tlsEnabled }}
  {{- if $tlsEnabled }}
  existingSecret: {{ $tlsSecretName }}
  serverPublicKey: "tls.crt"
  serverKey: "tls.key"
  {{- with (dig "tls" "caPublicKey" "ca.crt" .) }}
  caPublicKey: {{ . }}
  {{- end }}
  requireClientCertificate: false
  {{- end }}

# Replica configuration (master-replica replication)
replica:
  enabled: true
  replicas: {{ max (sub $replicasCount 1) 0 }}
  replicationUser: "default"
  disklessSync: false
  minReplicasToWrite: 0
  minReplicasMaxLag: 10
  persistence:
    size: {{ (default "10Gi" (dig "persistence" "size" "" .)) | quote }}
    {{- if and .persistence .persistence.storageClass }}
    storageClass: {{ .persistence.storageClass }}
    {{- end }}
  {{- if .sentinel }}
  # Sentinel configuration for automatic failover
  sentinel:
    enabled: {{ dig "sentinel" "enabled" false . }}
    {{- if dig "sentinel" "enabled" false . }}
    masterSet: "myprimary"
    {{- end }}
  {{- end }}

# Data storage configuration (standalone mode only)
dataStorage:
  enabled: {{ and $persistenceEnabled (le $replicasCount 1) }}
  {{- if and $persistenceEnabled (le $replicasCount 1) }}
  requestedSize: {{ (default "10Gi" (dig "persistence" "size" "" .)) | quote }}
  {{- if and .persistence .persistence.storageClass }}
  className: {{ .persistence.storageClass }}
  {{- end }}
  {{- end }}

# Metrics configuration
{{- if .metrics }}
metrics:
  enabled: {{ dig "metrics" "enabled" false . }}
  {{- if dig "metrics" "enabled" false . }}
  {{- if .metrics.serviceMonitor }}
  serviceMonitor:
    enabled: {{ dig "metrics" "serviceMonitor" "enabled" false . }}
  {{- end }}
  {{- if .metrics.prometheusRule }}
  prometheusRule:
    enabled: {{ dig "metrics" "prometheusRule" "enabled" false . }}
  {{- end }}
  {{- end }}
{{- end }}