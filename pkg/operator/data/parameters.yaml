{{- $fullname := (printf "valkey-%s" .Name) }}

fullnameOverride: {{ $fullname }}

{{- $sentinelEnabled := (dig "sentinel" "enabled" false .) }}
{{- $metricsEnabled := (dig "metrics" "enabled" false .) }}
{{- $metricsServiceMonitorEnabled := (dig "metrics" "monitor" "enabled" false .) }}
{{- $metricsPrometheusRuleEnabled := (dig "metrics" "prometheusRule" "enabled" false .) }}
{{- $tlsEnabled := (dig "tls" "enabled" false .) }}
{{- $persistenceEnabled := (dig "persistence" "enabled" false .) }}

{{- $bindingSecretName := (dig "binding" "secretName" "" .) }}
{{- if eq $bindingSecretName "" }}
{{- $bindingSecretName = printf "%s-binding" $fullname }}
{{- end }}

{{- /* the chart's other two images, os-shell and kubectl, stay unrendered:
       volumePermissions and sentinel.service.createPrimary are off */}}
{{- $imageRegistry := (dig "image" "registry" "" .) }}
{{- $imageRepository := (dig "image" "repository" "bitnamilegacy/valkey" .) }}
{{- $imageTag := (dig "image" "tag" (dig "version" "" .) .) }}
{{- /* the chart has no global.imagePullPolicy, so it is set on every image block below */}}
{{- $imagePullPolicy := (dig "image" "pullPolicy" "" .) }}
{{- $imagePullSecrets := (dig "image" "pullSecrets" (list) .) }}
{{- /* global.imageRegistry would win over these, so each image carries its own registry */}}
{{- $sentinelImageRegistry := (dig "sentinel" "image" "registry" $imageRegistry .) }}
{{- $sentinelImageRepository := (dig "sentinel" "image" "repository" "bitnamilegacy/valkey-sentinel" .) }}
{{- $sentinelImageTag := (dig "sentinel" "image" "tag" $imageTag .) }}
{{- $metricsImageRegistry := (dig "metrics" "image" "registry" $imageRegistry .) }}
{{- $metricsImageRepository := (dig "metrics" "image" "repository" "bitnamilegacy/redis-exporter" .) }}
{{- /* the exporter is versioned on its own, so its tag does not follow spec.version */}}
{{- $metricsImageTag := (dig "metrics" "image" "tag" "" .) }}

{{- $storageClass := "" }}
{{- if $persistenceEnabled }}
{{- $storageClass = (dig "persistence" "storageClass" "" .) }}
{{- end }}

image:
  {{- with $imageRegistry }}
  registry: {{ . | quote }}
  {{- end }}
  repository: {{ $imageRepository | quote }}
  {{- with $imageTag }}
  tag: {{ . | quote }}
  {{- end }}
  {{- with $imagePullPolicy }}
  pullPolicy: {{ . | quote }}
  {{- end }}

global:
  {{- with $storageClass }}
  storageClass: {{ . | quote }}
  {{- end }}
  {{- with $imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- /* the renderer skips NOTES.txt, where this check lives, so it is inert here.
         `helm template` still needs it: the repositories above are always relocated */}}
  security:
    allowInsecureImages: true

{{- if gt .replicas 1 }}
pdb:
  create: true
  minAvailable: "50%"
{{- end }}

primary:
  replicaCount: 1
  {{- with .nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .topologySpreadConstraints }}
  topologySpreadConstraints:
  {{- toYaml . | nindent 2 }}
  {{- end }}
  {{- with .tolerations }}
  tolerations:
  {{- toYaml . | nindent 2 }}
  {{- end }}
  {{- with .priorityClassName }}
  priorityClassName: {{ . | quote }}
  {{- end }}
  {{- with .podSecurityContext }}
  podSecurityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .podLabels }}
  podLabels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .podAnnotations }}
  podAnnotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .securityContext }}
  containerSecurityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  persistence:
    enabled: {{ $persistenceEnabled }}
    {{- if $persistenceEnabled }}
    {{- with .persistence.size }}
    size: {{ . | quote }}
    {{- end }}
    {{- end }}
  {{- if .persistence }}
  {{- with .persistence.extraVolumes }}
  extraVolumes: 
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- with .extraEnvVars }}
  extraEnvVars:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .extraFlags }}
  extraFlags:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .sidecars }}
  sidecars:
  {{- with .sidecars }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}   
  
replica:
  replicaCount: {{ ternary .replicas (max (sub .replicas 1) 0) $sentinelEnabled }}
  {{- with .nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .topologySpreadConstraints }}
  topologySpreadConstraints:
  {{- toYaml . | nindent 2 }}
  {{- end }}
  {{- with .tolerations }}
  tolerations:
  {{- toYaml . | nindent 2 }}
  {{- end }}
  {{- with .priorityClassName }}
  priorityClassName: {{ . | quote }}
  {{- end }}
  {{- with .podSecurityContext }}
  podSecurityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .podLabels }}
  podLabels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .podAnnotations }}
  podAnnotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .securityContext }}
  containerSecurityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  persistence:
    enabled: {{ $persistenceEnabled }}
    {{- if $persistenceEnabled }}
    {{- with .persistence.size }}
    size: {{ . | quote }}
    {{- end }}
    {{- end }}
  {{- if .persistence }}
  {{- with .persistence.extraVolumes }}
  extraVolumes: 
    {{- toYaml . | nindent 4 }}
  {{- end }} 
  {{- end }}
  {{- with .extraEnvVars }}
  extraEnvVars:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .extraFlags }}
  extraFlags:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .sidecars }}
  sidecars:
  {{- with .sidecars }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}   

{{- if $sentinelEnabled }}
sentinel:
  enabled: true
  image:
    {{- with $sentinelImageRegistry }}
    registry: {{ . | quote }}
    {{- end }}
    repository: {{ $sentinelImageRepository | quote }}
    {{- with $sentinelImageTag }}
    tag: {{ . | quote }}
    {{- end }}
    {{- with $imagePullPolicy }}
    pullPolicy: {{ . | quote }}
    {{- end }}
  {{- with .sentinel.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .sentinel.securityContext }}
  containerSecurityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .extraEnvVars }}
  extraEnvVars:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

{{- if $metricsEnabled }}
metrics:
  enabled: true
  image:
    {{- with $metricsImageRegistry }}
    registry: {{ . | quote }}
    {{- end }}
    repository: {{ $metricsImageRepository | quote }}
    {{- with $metricsImageTag }}
    tag: {{ . | quote }}
    {{- end }}
    {{- with $imagePullPolicy }}
    pullPolicy: {{ . | quote }}
    {{- end }}
  {{- with .metrics.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .metrics.securityContext }}
  containerSecurityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if $metricsServiceMonitorEnabled }}
  {{- with .metrics.monitor }}
  serviceMonitor:
    {{- toYaml . | nindent 4 }}
  {{- end }}{{- end }}
  {{- if $metricsPrometheusRuleEnabled }}
  {{- with .metrics.prometheusRule }}
  prometheusRule:
    {{- toYaml . | nindent 4 }}
  {{- end }}{{- end }}  
{{- end }}

{{- if $tlsEnabled }}
tls:
  enabled: true
  authClients: false
  {{- if (hasKey .tls "certManager") }}
  existingSecret: {{ printf "%s-tls" $fullname }}
  certKeyFilename: tls.key
  certFilename: tls.crt
  certCAFilename: ca.crt
  {{- else }}
  autoGenerated: true
  {{- end }}
{{- end }}

networkPolicy:
  enabled: true

extraDeploy:
- apiVersion: v1
  kind: Secret
  metadata:
    name: {{ $bindingSecretName | quote }}
    annotations:
      helm.sh/hook: post-install
  type: Opaque
{{- if and $tlsEnabled (hasKey .tls "certManager") }}
- apiVersion: cert-manager.io/v1
  kind: Certificate
  metadata:
    name: {{ $fullname }}
  spec:
    secretName: {{ printf "%s-tls" $fullname }}
    commonName: {{ $fullname }}
    dnsNames:
    - '{{ printf "%s.%s.svc.cluster.local" $fullname .Namespace }}'
    - '{{ printf "%s.%s.svc" $fullname .Namespace }}'
    - '{{ printf "%s.%s" $fullname .Namespace }}'
    - '{{ printf "%s" $fullname }}'
    - '{{ printf "*.%s.%s.svc.cluster.local" $fullname .Namespace }}'
    - '{{ printf "*.%s.%s.svc" $fullname .Namespace }}'
    - '{{ printf "*.%s.%s" $fullname .Namespace }}'
    - '{{ printf "*.%s" $fullname }}'
    - '{{ printf "%s-primary.%s.svc.cluster.local" $fullname .Namespace }}'
    - '{{ printf "%s-primary.%s.svc" $fullname .Namespace }}'
    - '{{ printf "%s-primary.%s" $fullname .Namespace }}'
    - '{{ printf "%s-primary" $fullname }}'
    - '{{ printf "*.%s-primary.%s.svc.cluster.local" $fullname .Namespace }}'
    - '{{ printf "*.%s-primary.%s.svc" $fullname .Namespace }}'
    - '{{ printf "*.%s-primary.%s" $fullname .Namespace }}'
    - '{{ printf "*.%s-primary" $fullname }}'
    - '{{ printf "%s-headless.%s.svc.cluster.local" $fullname .Namespace }}'
    - '{{ printf "%s-headless.%s.svc" $fullname .Namespace }}'
    - '{{ printf "%s-headless.%s" $fullname .Namespace }}'
    - '{{ printf "%s-headless" $fullname }}'
    - '{{ printf "*.%s-headless.%s.svc.cluster.local" $fullname .Namespace }}'
    - '{{ printf "*.%s-headless.%s.svc" $fullname .Namespace }}'
    - '{{ printf "*.%s-headless.%s" $fullname .Namespace }}'
    - '{{ printf "*.%s-headless" $fullname }}'
    - localhost
    ipAddresses:
    - 127.0.0.1
    issuerRef:
      {{- with .tls.certManager.issuer }}
      {{ toYaml . | nindent 6 }}
      {{- else }}
      name: {{ $fullname }}-selfsigned
      {{- end }}
    duration: 876000h
{{- if not .tls.certManager.issuer }}
- apiVersion: cert-manager.io/v1
  kind: Issuer
  metadata:
    name: {{ $fullname }}-selfsigned
  spec:
    selfSigned: {}
{{- end }}
{{- end }}